spring.application.name=Cebe-portal

spring.datasource.url=jdbc:mysql://localhost:3306/cebe?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.jpa.open-in-view=false

# Serializa LocalDate/LocalDateTime como strings ISO-8601 (evita array no JSON)
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.time-zone=America/Sao_Paulo

# JWT secret
api.security.token.secret=cebe-portal-secret-key-2024
