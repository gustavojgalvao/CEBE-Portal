<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Dashboard do aluno CEBE – acompanhe cursos, notificações e atendimento." />
    <title>Dashboard – CEBE</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@300;400;500;600;700&display=swap"
        rel="stylesheet" />
    <link
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap"
        rel="stylesheet" />
    <link rel="stylesheet" href="../assets/style.css" />
    <link rel="stylesheet" href="../assets/dashboard.css" />
    <link rel="stylesheet" href="../assets/notificacoes.css" />
</head>

<body class="dashboard-body">

    <div class="dashboard-layout">
        <!-- sidebar + topbar injetados por nav.js -->
        <div class="main-wrapper">
            <main class="dashboard-main">
                <div class="dashboard-content">

                    <!-- Saudação (visível apenas em mobile) -->
                    <section class="greeting-section" aria-label="Saudação">
                        <h1 class="greeting-title" id="greeting-nome">Olá, </h1>
                        <p class="greeting-subtitle">Bem-vindo ao seu portal de estudos.</p>
                    </section>

                    <div class="dashboard-grid">

                        <!-- ── Coluna esquerda ─────────────────────────────── -->
                        <div class="left-column">

                            <!-- Próxima aula -->
                            <div class="next-class-card" role="region" aria-label="Próxima aula">
                                <div class="next-class-bg-circle"></div>
                                <div class="next-class-inner">
                                    <div>
                                        <span class="next-class-badge">Próxima Aula</span>
                                        <h2 class="next-class-title" id="proxima-aula-nome">Carregando...</h2>
                                        <p class="next-class-location">
                                            <span class="material-symbols-outlined"
                                                style="font-size:18px;">meeting_room</span>
                                            <span id="proxima-aula-turno">Buscando informações...</span>
                                        </p>
                                    </div>
                                    <div class="next-class-timer" aria-label="Tempo restante">
                                        <div class="timer-block">
                                            <span class="timer-value" id="timer-h">--</span>
                                            <span class="timer-label">Horas</span>
                                        </div>
                                        <span class="timer-separator">:</span>
                                        <div class="timer-block">
                                            <span class="timer-value" id="timer-m">--</span>
                                            <span class="timer-label">Min</span>
                                        </div>
                                    </div>
                                </div>
                            </div>

                            <!-- Meus Cursos -->
                            <div class="section-header">
                                <h2 class="section-title">
                                    <span class="material-symbols-outlined"
                                        style="font-variation-settings:'FILL' 1;">menu_book</span>
                                    Meus Cursos
                                </h2>
                                <a class="btn-ver-todos" href="cursos.html">Ver todos</a>
                            </div>

                            <div class="courses-grid">

                                <div id="courses-container" style="display:flex; gap: 16px; flex-wrap: wrap;">
                                    <p style="color:var(--on-surface-variant); padding: 20px;">Carregando cursos...</p>
                                </div>

                            </div><!-- /courses-grid -->
                        </div><!-- /left-column -->

                        <!-- ── Coluna direita ──────────────────────────────── -->
                        <div class="right-column">

                            <!-- Atendimento rápido -->
                            <section class="atendimento-section" aria-label="Atendimento">
                                <h2 class="atendimento-title">
                                    <span class="material-symbols-outlined"
                                        style="font-variation-settings:'FILL' 1;">headset_mic</span>
                                    Atendimento
                                </h2>
                                <div class="atendimento-buttons">
                                    <button class="action-btn-primary" id="btn-novo-chamado-dash">
                                        <div class="action-btn-content">
                                            <div class="action-btn-icon">
                                                <span class="material-symbols-outlined"
                                                    style="font-variation-settings:'FILL' 1;">chat</span>
                                            </div>
                                            <div class="action-btn-text">
                                                <span class="action-btn-label">Novo Chamado / Mensagem</span>
                                                <span class="action-btn-sub">Fale com a secretaria</span>
                                            </div>
                                        </div>
                                        <span class="material-symbols-outlined action-btn-arrow">arrow_forward</span>
                                    </button>

                                    <button class="action-btn-outline" id="btn-agendar">
                                        <div class="action-btn-content">
                                            <div class="action-btn-icon">
                                                <span class="material-symbols-outlined"
                                                    style="font-variation-settings:'FILL' 1;">calendar_month</span>
                                            </div>
                                            <div class="action-btn-text">
                                                <span class="action-btn-label">Agendar Visita</span>
                                                <span class="action-btn-sub">Presencial na unidade</span>
                                            </div>
                                        </div>
                                        <span class="material-symbols-outlined action-btn-arrow">arrow_forward</span>
                                    </button>
                                </div>
                            </section>

                            <!-- Notificações (renderizadas dinamicamente) -->
                            <section class="notifications-card" aria-label="Notificações">
                                <div class="notifications-header">
                                    <h2 class="notifications-title">
                                        <span class="material-symbols-outlined"
                                            style="font-variation-settings:'FILL' 1;">notifications</span>
                                        Notificações
                                    </h2>
                                    <span class="notifications-badge" id="dash-notif-badge" aria-live="polite">0</span>
                                </div>
                                <div class="notifications-list" id="dash-notif-list" role="list" aria-live="polite">
                                </div>
                                <div class="notifications-footer">
                                    <button class="btn-ver-notificacoes" id="btn-ver-notif">Ver todas as
                                        notificações</button>
                                </div>
                            </section>

                        </div><!-- /right-column -->
                    </div><!-- /dashboard-grid -->
                </div><!-- /dashboard-content -->
            </main>
        </div><!-- /main-wrapper -->
    </div><!-- /dashboard-layout -->
    <!-- bottom-nav injetado por nav.js -->

    <script src="../services/api.js"></script>
    <script src="../services/auth-guard.js"></script>
    <script src="../services/notifications.js"></script>
    <script src="../components/nav.js"></script>
    <script>
        // ── Navegação ──────────────────────────────────────────────────────────────
        document.getElementById('btn-novo-chamado-dash')?.addEventListener('click', () => {
            window.location.href = 'atendimento.html';
        });
        document.getElementById('btn-agendar')?.addEventListener('click', () => {
            window.location.href = 'atendimento.html';
        });
        document.getElementById('btn-ver-notif')?.addEventListener('click', () => {
            window.location.href = 'notificacoes.html';
        });

        // ── Widget de notificações ─────────────────────────────────────────────────
        const NS = window.NotificationService;
        const MAX_PREVIEW = 3; // máximo de itens no widget

        function renderDashNotifs() {
            const unread = NS.getUnread();
            const badge = document.getElementById('dash-notif-badge');
            const list = document.getElementById('dash-notif-list');

            badge.textContent = unread.length;
            badge.style.display = unread.length ? '' : 'none';

            const items = NS.getAll().slice(0, MAX_PREVIEW);
            list.innerHTML = '';

            if (items.length === 0) {
                list.innerHTML = '<p style="padding:16px 20px;font-size:13px;color:var(--on-surface-variant);">Sem notificações.</p>';
                return;
            }

            items.forEach(n => {
                const item = document.createElement('div');
                item.className = `notification-item${n.read ? ' read' : ''}`;
                item.setAttribute('role', 'listitem');
                item.title = n.read ? '' : 'Clique para marcar como lida';
                item.innerHTML = `
                <div class="notification-stripe ${n.type}" aria-hidden="true"></div>
                <span class="material-symbols-outlined notification-icon ${n.type}">${n.icon || 'info'}</span>
                <div>
                    <p class="notification-text">${n.text}</p>
                    <span class="notification-time">${NS.formatTime(n.date)}</span>
                </div>`;

                if (!n.read) {
                    item.style.cursor = 'pointer';
                    item.addEventListener('click', () => NS.markAsRead(n.id));
                }
                list.appendChild(item);
            });
        }

        document.addEventListener('notifications-updated', renderDashNotifs);

        // ── Inicialização: sincroniza notificações com a API e renderiza ────────────
        async function initNotifs() {
            await NS.sync();
            renderDashNotifs();
        }
        initNotifs();

        // Quando a página carregar, buscar os dados do aluno logado
        async function inicializarDashboard() {
            try {
                // 1. Pega os dados do aluno e atualiza o nome
                const aluno = await apiFetch('/alunos/me');
                if (aluno && aluno.nome) {
                    // Pega o primeiro nome
                    const primeiroNome = aluno.nome.split(' ')[0];
                    document.getElementById('greeting-nome').textContent = `Olá, ${primeiroNome}!`;
                }

                // 2. Busca os cursos reais (matrículas) e atualiza a tela
                const matriculas = await apiFetch('/matriculas/me');
                const container = document.getElementById('courses-container');
                container.innerHTML = ''; // Limpa o "Carregando..."

                if (matriculas.length === 0) {
                    container.innerHTML = '<p style="color:var(--on-surface-variant); padding: 20px;">Você ainda não possui cursos matriculados.</p>';
                    // Atualiza card Próxima Aula
                    document.getElementById('proxima-aula-nome').textContent = 'Nenhum curso ativo';
                    document.getElementById('proxima-aula-turno').textContent = 'Matricule-se para ver sua próxima aula';
                    document.getElementById('timer-h').textContent = '--';
                    document.getElementById('timer-m').textContent = '--';
                } else {
                    // Preenche card Próxima Aula com o primeiro curso
                    const primeiraMat = matriculas[0];
                    const primeiroNomeCurso = primeiraMat.turma?.cursos?.nome || 'Seu Curso';
                    const primeiroTurno = primeiraMat.turma?.turno || '';
                    document.getElementById('proxima-aula-nome').textContent = primeiroNomeCurso;

                    // Horário baseado no turno
                    let horarioTexto = 'Turno Matutino — 08:00 às 11:00';
                    let proximaHora = 8, proximoMin = 0;
                    if (primeiroTurno === 'Vespertino') {
                        horarioTexto = 'Turno Vespertino — 14:00 às 17:00';
                        proximaHora = 14;
                    }
                    document.getElementById('proxima-aula-turno').textContent = horarioTexto;

                    // Calcula o tempo até a próxima aula (hoje ou amanhã)
                    const agora = new Date();
                    const aula = new Date();
                    aula.setHours(proximaHora, proximoMin, 0, 0);
                    if (agora >= aula) aula.setDate(aula.getDate() + 1); // próximo dia
                    const diffMs = aula - agora;
                    const horas = Math.floor(diffMs / 3600000);
                    const mins = Math.floor((diffMs % 3600000) / 60000);
                    document.getElementById('timer-h').textContent = String(horas).padStart(2, '0');
                    document.getElementById('timer-m').textContent = String(mins).padStart(2, '0');

                    matriculas.forEach(mat => {
                        const cursoNome = mat.turma?.cursos?.nome || `Turma ${mat.turma?.id || 'Desconhecida'}`;
                        const turno = mat.turma?.turno || 'N/A';
                        
                            // Define as informações extras baseado no turno para simular
                            let horario = "08:00 – 11:00";
                            let dias = "Seg, Qua, Sex";
                            let icone = "menu_book";
                            
                            if(turno === "Vespertino") {
                                horario = "14:00 – 17:00";
                                dias = "Ter, Qui";
                            }
                            
                            if(cursoNome.toLowerCase().includes("confeitaria")) icone = "cake";
                            if(cursoNome.toLowerCase().includes("auxiliar") || cursoNome.toLowerCase().includes("info")) icone = "computer";
                            
                            container.innerHTML += `
                                <article class="course-card" tabindex="0" onclick="window.location.href='cursos.html'">
                                    <div class="course-card-bg"></div>
                                    <div class="course-card-header">
                                        <div class="course-icon">
                                            <span class="material-symbols-outlined" style="font-variation-settings:'FILL' 1;">${icone}</span>
                                        </div>
                                        <span class="course-badge">${turno}</span>
                                    </div>
                                    <h3 class="course-name">${cursoNome}</h3>
                                    <div class="course-details">
                                        <div class="course-detail-row">
                                            <span class="material-symbols-outlined">calendar_today</span>
                                            <span>${dias}</span>
                                        </div>
                                        <div class="course-detail-row">
                                            <span class="material-symbols-outlined">schedule</span>
                                            <span>${horario}</span>
                                        </div>
                                        <div class="course-detail-row">
                                            <span class="material-symbols-outlined">info</span>
                                            <span>Status Pgto: ${mat.statusPagamento}</span>
                                        </div>
                                    </div>
                                    <div class="course-progress">
                                        <div class="course-progress-header">
                                            <span class="progress-label">Progresso</span>
                                            <span class="progress-value">Aulas em andamento</span>
                                        </div>
                                        <div class="progress-track">
                                            <div class="progress-fill" style="width:50%"></div>
                                        </div>
                                    </div>
                                </article>
                        `;
                    });
                }

            } catch (erro) {
                console.error('Sessão inválida:', erro);
                window.location.href = 'login.html';
            }
        }
        inicializarDashboard();
    </script>
</body>


</html>
