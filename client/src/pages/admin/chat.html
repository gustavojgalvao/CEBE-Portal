<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CEBE Admin - Chat</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap" rel="stylesheet" />
    <style>
        :root {
            --primary: #1a7a4a;
            --primary-dark: #0f5c35;
            --primary-light: #e8f5ee;
            --surface: #ffffff;
            --background-main: #f5f5f5;
            --background-light: #fafafa;
            --border-light: #e0e0e0;
            --text-main: #1a1a1a;
            --text-light: #666666;
            --danger: #ba1a1a;
            --radius-sm: 6px;
            --radius-md: 10px;
            --radius-lg: 16px;
            --shadow-sm: 0 1px 4px rgba(0,0,0,0.08);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--background-light);
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        .admin-sidebar {
            width: 260px;
            background: var(--surface);
            border-right: 1px solid var(--border-light);
            display: flex;
            flex-direction: column;
            padding: 1.5rem;
            flex-shrink: 0;
        }

        .admin-sidebar h2 {
            font-size: 1.125rem;
            color: var(--primary-dark);
            margin-bottom: 2rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .admin-nav-item {
            padding: 0.75rem 1rem;
            border-radius: var(--radius-md);
            color: var(--text-main);
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 0.75rem;
            margin-bottom: 0.5rem;
            transition: background 0.2s;
            font-size: 0.9rem;
        }

        .admin-nav-item.active {
            background: var(--primary-light);
            color: var(--primary-dark);
            font-weight: 500;
        }

        .admin-nav-item:hover:not(.active) {
            background: var(--background-main);
        }

        .admin-main {
            flex: 1;
            display: flex;
            flex-direction: column;
            min-width: 0;
        }

        .admin-topbar {
            height: 64px;
            background: var(--surface);
            border-bottom: 1px solid var(--border-light);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 1.5rem;
            flex-shrink: 0;
        }

        .chat-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: var(--surface);
            margin: 1.25rem;
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-sm);
            overflow: hidden;
            min-height: 0;
        }

        .chat-header {
            padding: 1rem 1.5rem;
            border-bottom: 1px solid var(--border-light);
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--background-main);
            flex-shrink: 0;
        }

        .chat-header h3 {
            font-size: 1rem;
            color: var(--text-main);
        }

        .chat-header p {
            font-size: 0.8rem;
            color: var(--text-light);
            margin-top: 2px;
        }

        .chat-messages {
            flex: 1;
            padding: 1.5rem;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
            background: #e5ddd5;
            min-height: 0;
        }

        .msg-bubble {
            max-width: 70%;
            padding: 0.6rem 0.9rem;
            border-radius: var(--radius-md);
            line-height: 1.45;
            box-shadow: 0 1px 2px rgba(0,0,0,0.1);
            word-break: break-word;
        }

        .msg-aluno {
            background: #ffffff;
            align-self: flex-start;
            border-top-left-radius: 2px;
        }

        .msg-admin {
            background: #dcf8c6;
            align-self: flex-end;
            border-top-right-radius: 2px;
        }

        .msg-label {
            font-size: 0.7rem;
            font-weight: 600;
            color: var(--primary-dark);
            margin-bottom: 2px;
        }

        .msg-info {
            font-size: 0.72rem;
            color: #777;
            text-align: right;
            margin-top: 3px;
            display: block;
        }

        .chat-input-area {
            padding: 1rem 1.25rem;
            background: var(--surface);
            border-top: 1px solid var(--border-light);
            display: flex;
            gap: 0.75rem;
            align-items: center;
            flex-shrink: 0;
        }

        .chat-input-area input {
            flex: 1;
            padding: 0.7rem 1rem;
            border: 1px solid var(--border-light);
            border-radius: 100px;
            outline: none;
            font-family: inherit;
            font-size: 0.9rem;
            transition: border-color 0.2s;
        }

        .chat-input-area input:focus {
            border-color: var(--primary);
        }

        .btn-send {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            background: var(--primary);
            color: white;
            border: none;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: background 0.2s;
            flex-shrink: 0;
        }

        .btn-send:hover { background: var(--primary-dark); }

        .status-select {
            padding: 0.4rem 0.75rem;
            border-radius: var(--radius-sm);
            border: 1px solid var(--border-light);
            font-family: inherit;
            font-size: 0.85rem;
            cursor: pointer;
        }

        .status-select:focus { outline: none; border-color: var(--primary); }

        .btn-back {
            background: none;
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 0.4rem;
            color: var(--text-main);
            font-family: inherit;
            font-size: 0.9rem;
            padding: 0.4rem 0.75rem;
            border-radius: var(--radius-sm);
            transition: background 0.2s;
        }
        .btn-back:hover { background: var(--background-main); }

        .sse-indicator {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #ccc;
            display: inline-block;
            margin-right: 6px;
            transition: background 0.3s;
        }
        .sse-indicator.connected { background: #22c55e; }
        .sse-indicator.error { background: #ef4444; }
    </style>
</head>
<body>

    <aside class="admin-sidebar">
        <h2>
            <span class="material-symbols-outlined" style="font-size:22px;">admin_panel_settings</span>
            CEBE Admin
        </h2>
        <a href="dashboard.html" class="admin-nav-item active">
            <span class="material-symbols-outlined" style="font-size:20px;">forum</span>
            Atendimentos
        </a>
        <div style="flex:1"></div>
        <a href="#" onclick="logoutAdmin()" class="admin-nav-item" style="color: var(--danger);">
            <span class="material-symbols-outlined" style="font-size:20px;">logout</span>
            Sair
        </a>
    </aside>

    <main class="admin-main">
        <header class="admin-topbar">
            <div style="display: flex; align-items: center; gap: 0.75rem;">
                <button class="btn-back" onclick="history.back()">
                    <span class="material-symbols-outlined" style="font-size:20px;">arrow_back</span>
                    Voltar
                </button>
                <h1 style="font-size: 1.1rem; font-weight: 600;">Chat do Chamado</h1>
            </div>
            <div style="display:flex; align-items:center; gap:0.5rem;">
                <span class="sse-indicator" id="sseIndicator" title="Conexão em tempo real"></span>
                <span id="adminName" style="font-weight: 500; font-size: 0.9rem;">Secretaria</span>
            </div>
        </header>

        <div class="chat-container">
            <div class="chat-header">
                <div>
                    <h3 id="chatTitle">Carregando...</h3>
                    <p id="chatSubtitle"></p>
                </div>
                <div style="display: flex; align-items: center; gap: 0.75rem;">
                    <label style="font-size: 0.85rem; font-weight: 500;">Status:</label>
                    <select id="statusSelect" class="status-select" onchange="atualizarStatus(this.value)">
                        <option value="Pendente">Pendente</option>
                        <option value="Em_andamento">Em andamento</option>
                        <option value="Finalizado">Finalizado</option>
                    </select>
                </div>
            </div>

            <div class="chat-messages" id="chatMessages">
                <!-- Mensagens aparecem aqui -->
            </div>

            <form class="chat-input-area" id="chatForm">
                <input type="text" id="chatInput" placeholder="Digite sua resposta..." required autocomplete="off">
                <button type="submit" class="btn-send" aria-label="Enviar">
                    <span class="material-symbols-outlined" style="font-size:20px;">send</span>
                </button>
            </form>
        </div>
    </main>

    <script src="../services/api.js"></script>
    <script>
        // ── Auth guard ─────────────────────────────────────────────────────────
        if (localStorage.getItem('cebe_role') !== 'ADMIN') {
            window.location.href = 'login.html';
        }

        const urlParams = new URLSearchParams(window.location.search);
        const atendimentoId = urlParams.get('id');

        if (!atendimentoId) {
            alert('ID do chamado não fornecido');
            window.location.href = 'dashboard.html';
        }

        let originalAtendimento = null;
        let sseConnection = null;

        // ── Indicador de status SSE ────────────────────────────────────────────
        function setSseStatus(status) {
            const dot = document.getElementById('sseIndicator');
            dot.className = 'sse-indicator ' + status;
            dot.title = status === 'connected' ? 'Tempo real ativo' :
                        status === 'error'     ? 'Erro na conexão em tempo real' : 'Conectando...';
        }

        // ── Carregar cabeçalho do chamado ─────────────────────────────────────
        async function carregarCabecalho() {
            try {
                const atendimento = await apiFetch(`/admin/atendimentos/${atendimentoId}`);
                originalAtendimento = atendimento;

                if (atendimento) {
                    document.getElementById('chatTitle').textContent =
                        `Chamado #${atendimento.id} — ${atendimento.alunoNome || 'Aluno'}`;
                    const dataAbertura = new Date(atendimento.dataHora).toLocaleString('pt-BR');
                    document.getElementById('chatSubtitle').textContent = `Aberto em ${dataAbertura}`;
                    document.getElementById('statusSelect').value = atendimento.statusAtendimento || 'Pendente';
                }
            } catch (err) {
                console.error('Erro ao carregar cabeçalho:', err);
            }
        }

        // ── Renderização de mensagens ──────────────────────────────────────────
        function appendMensagem(m, scroll = true) {
            const container = document.getElementById('chatMessages');
            const data = new Date(m.dataHora).toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
            const isAdmin = m.remetenteTipo === 'ADMIN';
            const cssClass = isAdmin ? 'msg-admin' : 'msg-aluno';
            const label = isAdmin ? 'Secretaria' : (originalAtendimento?.alunoNome || 'Aluno');

            const div = document.createElement('div');
            div.className = `msg-bubble ${cssClass}`;
            div.innerHTML = `
                <div class="msg-label">${label}</div>
                <div>${escapeHtml(m.mensagem)}</div>
                <span class="msg-info">${data}</span>
            `;
            container.appendChild(div);
            if (scroll) container.scrollTop = container.scrollHeight;
        }

        function escapeHtml(text) {
            return text
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;');
        }

        // ── Carregar histórico de mensagens ───────────────────────────────────
        async function carregarMensagens() {
            try {
                const container = document.getElementById('chatMessages');
                container.innerHTML = '';

                // Mensagem original de abertura do chamado
                if (originalAtendimento) {
                    const dataOriginal = new Date(originalAtendimento.dataHora)
                        .toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
                    const div = document.createElement('div');
                    div.className = 'msg-bubble msg-aluno';
                    div.innerHTML = `
                        <div class="msg-label">${originalAtendimento.alunoNome || 'Aluno'}</div>
                        <div>${escapeHtml(originalAtendimento.mensagem)}</div>
                        <span class="msg-info">${dataOriginal}</span>
                    `;
                    container.appendChild(div);
                }

                const mensagens = await apiFetch(`/admin/atendimentos/${atendimentoId}/mensagens`);
                mensagens.forEach(m => appendMensagem(m, false));

                container.scrollTop = container.scrollHeight;
            } catch (err) {
                console.error('Erro ao carregar mensagens:', err);
            }
        }

        // ── SSE: conexão em tempo real ─────────────────────────────────────────
        function conectarSSE() {
            if (sseConnection) {
                sseConnection.close();
            }

            const token = localStorage.getItem('cebe_token');
            const sseUrl = `http://localhost:8080/admin/atendimentos/${atendimentoId}/stream?token=${encodeURIComponent(token)}`;

            sseConnection = new EventSource(sseUrl);

            sseConnection.onopen = () => {
                setSseStatus('connected');
            };

            sseConnection.addEventListener('nova-mensagem', (event) => {
                try {
                    const msg = JSON.parse(event.data);
                    appendMensagem(msg);
                } catch (e) {
                    console.error('Erro ao parsear mensagem SSE:', e);
                }
            });

            sseConnection.onerror = () => {
                setSseStatus('error');
                // Tenta reconectar após 5s
                sseConnection.close();
                setTimeout(conectarSSE, 5000);
            };
        }

        // ── Atualizar status ───────────────────────────────────────────────────
        async function atualizarStatus(novoStatus) {
            try {
                await apiFetch(`/admin/atendimentos/${atendimentoId}/status`, {
                    method: 'PUT',
                    body: JSON.stringify({ status: novoStatus })
                });
            } catch (err) {
                alert('Erro ao atualizar status: ' + (err.message || err));
            }
        }

        // ── Enviar mensagem ────────────────────────────────────────────────────
        document.getElementById('chatForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const input = document.getElementById('chatInput');
            const texto = input.value.trim();
            if (!texto) return;

            input.value = '';
            input.disabled = true;

            try {
                // O back-end notifica o aluno via SSE após salvar. Nós NÃO adicionamos a mensagem
                // manualmente aqui — ela virá de volta pelo nosso próprio EventSource.
                await apiFetch(`/admin/atendimentos/${atendimentoId}/mensagens`, {
                    method: 'POST',
                    body: JSON.stringify({ texto })
                });

                // Atualiza o select localmente se estava Pendente
                if (document.getElementById('statusSelect').value === 'Pendente') {
                    document.getElementById('statusSelect').value = 'Em_andamento';
                }
            } catch (err) {
                alert('Erro ao enviar mensagem: ' + (err.message || err));
            } finally {
                input.disabled = false;
                input.focus();
            }
        });

        // ── Logout ─────────────────────────────────────────────────────────────
        function logoutAdmin() {
            localStorage.removeItem('cebe_token');
            localStorage.removeItem('cebe_role');
            window.location.href = 'login.html';
        }

        // ── Inicialização ──────────────────────────────────────────────────────
        window.addEventListener('DOMContentLoaded', async () => {
            await carregarCabecalho();
            await carregarMensagens();
            conectarSSE();
        });

        // Fechar SSE ao sair da página
        window.addEventListener('beforeunload', () => {
            if (sseConnection) sseConnection.close();
        });
    </script>
</body>
</html>
