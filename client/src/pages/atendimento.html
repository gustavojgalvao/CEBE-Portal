<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Atendimento CEBE – fale com a secretaria e acompanhe seus chamados." />
    <title>Atendimento – CEBE</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@300;400;500;600;700&display=swap"
        rel="stylesheet" />
    <link
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap"
        rel="stylesheet" />
    <link rel="stylesheet" href="../assets/style.css" />
    <link rel="stylesheet" href="../assets/dashboard.css" />
    <link rel="stylesheet" href="../assets/atendimento.css" />
</head>

<body class="dashboard-body">

    <div class="dashboard-layout">
        <!-- sidebar + topbar injetados por nav.js -->
        <div class="main-wrapper">

            <!-- Layout do atendimento (lista + chat) -->
            <div class="atendimento-layout" id="atendimento-layout">

                <!-- ── Painel esquerdo: lista de conversas ─────────────────── -->
                <div class="conversations-panel" id="conversations-panel">

                    <div class="conversations-header">
                        <div class="conversations-header-top">
                            <h1 class="conversations-title">Atendimento</h1>
                            <button class="btn-new-conversation" id="btn-new-conv" aria-label="Novo chamado">
                                <span class="material-symbols-outlined" style="font-size:20px;">edit_square</span>
                            </button>
                        </div>
                        <div class="search-bar">
                            <span class="material-symbols-outlined search-icon">search</span>
                            <input type="search" class="search-input" id="search-conversations"
                                placeholder="Buscar chamados..." aria-label="Buscar conversas" />
                        </div>
                    </div>

                    <div class="conversations-list" id="conversations-list" role="list">
                        <div style="padding:20px; color:var(--on-surface-variant);">Carregando chamados...</div>
                    </div><!-- /conversations-list -->
                </div><!-- /conversations-panel -->

                <!-- ── Painel direito: janela de chat ──────────────────────── -->
                <div class="chat-panel" id="chat-panel">

                    <!-- Estado vazio -->
                    <div class="chat-empty-state" id="chat-empty">
                        <div class="chat-empty-icon">
                            <span class="material-symbols-outlined">chat</span>
                        </div>
                        <p class="chat-empty-title">Selecione um chamado</p>
                        <p class="chat-empty-sub">Escolha uma conversa ou abra um novo chamado.</p>
                        <button class="btn-new-ticket" id="btn-empty-new"
                            style="width:auto;padding:12px 24px;border-radius:12px;">
                            <span class="material-symbols-outlined">add</span>
                            Novo Chamado
                        </button>
                    </div>

                    <!-- Janela de chat -->
                    <div id="chat-window" style="display:none;flex-direction:column;flex:1;overflow:hidden;">

                        <div class="chat-header">
                            <button class="chat-header-back" id="chat-back-btn" aria-label="Voltar">
                                <span class="material-symbols-outlined">arrow_back</span>
                            </button>
                            <div class="chat-header-avatar" aria-hidden="true">SE</div>
                            <div class="chat-header-info">
                                <div class="chat-header-name">Secretaria</div>
                                <div class="chat-header-status">Online agora</div>
                            </div>
                            <span class="ticket-status-tag">Aberto</span>
                            <div class="chat-header-actions">
                                <button class="chat-action-btn" aria-label="Informações">
                                    <span class="material-symbols-outlined">info</span>
                                </button>
                                <button class="chat-action-btn" aria-label="Mais opções">
                                    <span class="material-symbols-outlined">more_vert</span>
                                </button>
                            </div>
                        </div>

                        <div class="chat-messages" id="chat-messages" role="log" aria-live="polite">
                            <div class="system-message" id="chat-system-message">Selecione um chamado</div>

                            <div class="message-row incoming" id="chat-first-message">
                                <div class="message-avatar" aria-hidden="true">SE</div>
                                <div class="message-bubble-wrapper">
                                    <span class="message-sender-name">Secretaria</span>
                                    <div class="message-bubble" id="chat-message-text">...</div>
                                    <div class="message-meta"><span>13:55</span></div>
                                </div>
                            </div>

                            <!-- Indicador "digitando..." -->
                            <div class="typing-indicator" id="typing-indicator" style="display:none;"
                                aria-label="Digitando">
                                <div class="message-avatar" aria-hidden="true">SE</div>
                                <div class="typing-dots">
                                    <span class="typing-dot"></span>
                                    <span class="typing-dot"></span>
                                    <span class="typing-dot"></span>
                                </div>
                            </div>
                        </div><!-- /chat-messages -->

                        <div class="chat-input-bar">
                            <div class="chat-input-inner">
                                <button class="chat-input-attach" aria-label="Anexar arquivo">
                                    <span class="material-symbols-outlined">attach_file</span>
                                </button>
                                <textarea class="chat-textarea" id="chat-input" rows="1"
                                    placeholder="Digite sua mensagem..." aria-label="Campo de mensagem"
                                    maxlength="2000"></textarea>
                                <div class="chat-input-actions">
                                    <button class="chat-input-emoji" aria-label="Emoji">
                                        <span class="material-symbols-outlined">mood</span>
                                    </button>
                                    <button class="chat-send-btn" id="chat-send-btn" aria-label="Enviar">
                                        <span class="material-symbols-outlined">send</span>
                                    </button>
                                </div>
                            </div>
                            <p class="chat-input-note">Respondemos em horário comercial (seg–sex, 8h–18h).</p>
                        </div>

                    </div><!-- /chat-window -->
                </div><!-- /chat-panel -->
            </div><!-- /atendimento-layout -->

        </div><!-- /main-wrapper -->
    </div><!-- /dashboard-layout -->
    <!-- bottom-nav injetado por nav.js -->

    <!-- Modal: Novo Chamado -->
    <div class="modal-overlay" id="modal-overlay" role="dialog" aria-modal="true" aria-labelledby="modal-title">
        <div class="modal-box">
            <div class="modal-header">
                <h2 class="modal-title" id="modal-title">Novo Chamado</h2>
                <button class="modal-close" id="modal-close" aria-label="Fechar">
                    <span class="material-symbols-outlined">close</span>
                </button>
            </div>
            <div class="modal-form">
                <div>
                    <label class="modal-label" for="modal-setor">Setor / Departamento</label>
                    <select class="modal-select" id="modal-setor">
                        <option value="" disabled selected>Selecione o setor...</option>
                        <option value="secretaria">Secretaria</option>
                        <option value="financeiro">Financeiro</option>
                        <option value="coordenacao">Coordenação</option>
                        <option value="suporte">Suporte Técnico</option>
                    </select>
                </div>
                <div>
                    <label class="modal-label" for="modal-assunto">Assunto</label>
                    <input type="text" class="modal-input" id="modal-assunto"
                        placeholder="Ex: Dúvida sobre falta, declaração..." maxlength="100" />
                </div>
                <div>
                    <label class="modal-label" for="modal-descricao">Descrição</label>
                    <textarea class="modal-textarea" id="modal-descricao" placeholder="Descreva sua solicitação..."
                        maxlength="1000"></textarea>
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn-modal-cancel" id="btn-modal-cancel">Cancelar</button>
                <button class="btn-modal-submit" id="btn-modal-submit">
                    <span class="material-symbols-outlined" style="font-size:16px;vertical-align:middle;">send</span>
                    Abrir Chamado
                </button>
            </div>
        </div>
    </div>

    <script src="../services/api.js"></script>
    <script src="../services/auth-guard.js"></script>
    <script src="../services/atendimento.js"></script>
    <script src="../components/nav.js"></script>
    <script>
        // ── Referências ────────────────────────────────────────────────────────
        const convItems = document.querySelectorAll('.conversation-item');
        const convPanel = document.getElementById('conversations-panel');
        const chatEmpty = document.getElementById('chat-empty');
        const chatWindow = document.getElementById('chat-window');
        const chatMessages = document.getElementById('chat-messages');
        const typingIndicator = document.getElementById('typing-indicator');
        const chatInput = document.getElementById('chat-input');
        const modalOverlay = document.getElementById('modal-overlay');

        const isMobile = () => window.innerWidth < 768;
        const scrollToBottom = () => { chatMessages.scrollTop = chatMessages.scrollHeight; };

        // ── Busca de chamados dinamicamente ──────────────────────────────────
        let chamadosGlobais = [];

        async function carregarAtendimentos() {
            try {
                const chamados = await apiFetch('/atendimentos/me');
                chamadosGlobais = chamados;
                renderizarChamados();
            } catch (e) {
                console.error('Erro ao carregar atendimentos:', e);
            }
        }

        function renderizarChamados() {
            const listContainer = document.getElementById('conversations-list');
            listContainer.innerHTML = '';
            
            if (chamadosGlobais.length === 0) {
                listContainer.innerHTML = '<div style="padding:20px; color:var(--on-surface-variant);">Nenhum chamado aberto.</div>';
                return;
            }

            // Agrupa ou apenas lista (simplificado)
            listContainer.innerHTML = '<div class="conv-group-label">Meus Chamados</div>';

            chamadosGlobais.forEach((chamado, index) => {
                const data = new Date(chamado.dataHora);
                const timeStr = data.getHours().toString().padStart(2, '0') + ':' + data.getMinutes().toString().padStart(2, '0');
                
                const cssStatus = chamado.statusAtendimento === 'Finalizado' ? 'fechado' :
                                  chamado.statusAtendimento === 'Em_andamento' ? 'aberto' : 'aguardando';

                const div = document.createElement('div');
                div.className = 'conversation-item';
                div.setAttribute('role', 'listitem');
                div.tabIndex = 0;
                
                div.innerHTML = `
                    <div class="conv-avatar ${cssStatus === 'fechado' ? 'orange' : 'green'}">
                        ${cssStatus !== 'fechado' ? '<span class="online-dot" aria-label="Online"></span>' : ''}
                    </div>
                    <div class="conv-body">
                        <div class="conv-top">
                            <span class="conv-name">Chamado #${chamado.id}</span>
                            <span class="conv-time">${timeStr}</span>
                        </div>
                        <div class="conv-preview-row">
                            <span class="conv-preview">${chamado.mensagem}</span>
                            <span class="conv-status ${cssStatus}">${chamado.statusAtendimento.replace('_', ' ')}</span>
                        </div>
                    </div>
                `;

                div.addEventListener('click', () => selectConversation(div, chamado));
                div.addEventListener('keydown', e => {
                    if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); selectConversation(div, chamado); }
                });

                listContainer.appendChild(div);

                if(index === 0 && !isMobile()) {
                    selectConversation(div, chamado);
                }
            });
        }

        function selectConversation(item, chamado) {
            document.querySelectorAll('.conversation-item').forEach(c => c.classList.remove('active'));
            if(item) item.classList.add('active');
            
            chatEmpty.style.display = 'none';
            chatWindow.style.display = 'flex';
            if (isMobile()) convPanel.classList.add('mobile-hidden');
            
            if(chamado) {
                document.getElementById('chat-system-message').textContent = 'Chamado #' + chamado.id + ' criado em ' + new Date(chamado.dataHora).toLocaleString();
                document.getElementById('chat-message-text').textContent = chamado.mensagem;
            }

            scrollToBottom();
        }

        document.getElementById('chat-back-btn').addEventListener('click', () => {
            convPanel.classList.remove('mobile-hidden');
            chatEmpty.style.display = 'flex';
            chatWindow.style.display = 'none';
            document.querySelectorAll('.conversation-item').forEach(c => c.classList.remove('active'));
        });

        // Inicialização
        carregarAtendimentos();
        
        if (isMobile()) {
            chatEmpty.style.display = 'flex';
            chatWindow.style.display = 'none';
        }

        // ── Envio de mensagem ──────────────────────────────────────────────────
        const RESPOSTAS = [
            'Entendido! Vou verificar e retorno em breve.',
            'Obrigada pelo contato, João! Estamos analisando.',
            'Certo! Assim que tivermos a resposta, avisamos aqui.',
            'Recebido! Nosso time está verificando para você.',
        ];

        function now() {
            const d = new Date();
            return d.getHours().toString().padStart(2, '0') + ':' + d.getMinutes().toString().padStart(2, '0');
        }

        function addMessage(text, type) {
            const row = document.createElement('div');
            row.className = `message-row ${type}`;

            const isIncoming = type === 'incoming';
            row.innerHTML = `
            <div class="message-avatar${isIncoming ? ' green' : ' hidden-avatar'}" aria-hidden="true">
                ${isIncoming ? 'SE' : ''}
            </div>
            <div class="message-bubble-wrapper">
                <div class="message-bubble">${text}</div>
                <div class="message-meta">
                    <span>${now()}</span>
                    ${!isIncoming ? '<span class="material-symbols-outlined message-status-icon">done</span>' : ''}
                </div>
            </div>`;

            chatMessages.insertBefore(row, typingIndicator);
            scrollToBottom();
            return row;
        }

        function sendMessage() {
            const text = chatInput.value.trim();
            if (!text) return;

            addMessage(text, 'outgoing');
            chatInput.value = '';
            chatInput.style.height = 'auto';

            setTimeout(() => {
                typingIndicator.style.display = 'flex';
                scrollToBottom();
                setTimeout(() => {
                    typingIndicator.style.display = 'none';
                    addMessage(RESPOSTAS[Math.floor(Math.random() * RESPOSTAS.length)], 'incoming');
                }, 2500);
            }, 800);
        }

        document.getElementById('chat-send-btn').addEventListener('click', sendMessage);
        chatInput.addEventListener('keydown', e => {
            if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
        });
        chatInput.addEventListener('input', () => {
            chatInput.style.height = 'auto';
            chatInput.style.height = Math.min(chatInput.scrollHeight, 120) + 'px';
        });

        // ── Modal ──────────────────────────────────────────────────────────────
        function openModal() { modalOverlay.classList.add('open'); }
        function closeModal() { modalOverlay.classList.remove('open'); }

        // O botão btn-novo-chamado é injetado pelo nav.js; aqui sobrescrevemos
        document.getElementById('btn-novo-chamado')?.addEventListener('click', openModal);
        document.getElementById('btn-new-conv').addEventListener('click', openModal);
        document.getElementById('btn-empty-new').addEventListener('click', openModal);
        document.getElementById('modal-close').addEventListener('click', closeModal);
        document.getElementById('btn-modal-cancel').addEventListener('click', closeModal);
        modalOverlay.addEventListener('click', e => { if (e.target === modalOverlay) closeModal(); });
        document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });

        document.getElementById('btn-modal-submit').addEventListener('click', async () => {
            const setor = document.getElementById('modal-setor').value;
            const assunto = document.getElementById('modal-assunto').value.trim();
            const descricao = document.getElementById('modal-descricao').value.trim();

            if (!setor || !assunto || !descricao) {
                [document.getElementById('modal-setor'),
                document.getElementById('modal-assunto'),
                document.getElementById('modal-descricao')].forEach(el => {
                    if (!el.value.trim()) {
                        el.style.borderColor = '#ba1a1a';
                        el.addEventListener('input', () => el.style.borderColor = '', { once: true });
                    }
                });
                return;
            }

            const btnSubmit = document.getElementById('btn-modal-submit');
            btnSubmit.disabled = true;
            btnSubmit.textContent = 'Enviando...';

            try {
                const novoChamado = await apiFetch('/atendimentos', {
                    method: 'POST',
                    body: JSON.stringify({
                        setor,
                        mensagem: assunto + " - " + descricao,
                        statusAtendimento: 'Pendente'
                    })
                });

                closeModal();
                document.getElementById('modal-setor').value = '';
                document.getElementById('modal-assunto').value = '';
                document.getElementById('modal-descricao').value = '';

                // Recarrega lista e seleciona o novo chamado (primeiro da lista)
                await carregarAtendimentos();
                const primeiroItem = document.querySelector('.conversation-item');
                if (primeiroItem && !isMobile()) {
                    primeiroItem.click();
                }

            } catch (e) {
                console.warn('Erro ao criar atendimento:', e);
                closeModal();
            } finally {
                btnSubmit.disabled = false;
                btnSubmit.innerHTML = '<span class="material-symbols-outlined" style="font-size:16px;vertical-align:middle;">send</span> Abrir Chamado';
            }
        });

        // ── Busca de conversas ─────────────────────────────────────────────────
        document.getElementById('search-conversations').addEventListener('input', e => {
            const q = e.target.value.toLowerCase();
            document.querySelectorAll('.conversation-item').forEach(item => {
                const text = item.querySelector('.conv-name').textContent.toLowerCase()
                    + item.querySelector('.conv-preview').textContent.toLowerCase();
                item.style.display = text.includes(q) ? 'flex' : 'none';
            });
        });
    </script>
</body>
</html>
