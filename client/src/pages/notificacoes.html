<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Notificações do portal CEBE – acompanhe avisos, confirmações e atualizações." />
    <title>Notificações – CEBE</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@300;400;500;600;700&display=swap"
        rel="stylesheet" />
    <link
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap"
        rel="stylesheet" />
    <link rel="stylesheet" href="../assets/style.css" />
    <link rel="stylesheet" href="../assets/dashboard.css" />
    <link rel="stylesheet" href="../assets/notificacoes.css" />
</head>

<body class="dashboard-body">

    <div class="dashboard-layout">
        <!-- sidebar + topbar injetados por nav.js -->
        <div class="main-wrapper">
            <main class="notif-main">
                <div class="notif-content">

                    <!-- Cabeçalho -->
                    <div class="notif-header">
                        <h1 class="notif-page-title">Notificações</h1>
                        <button class="btn-mark-all-read" id="btn-mark-all">
                            <span class="material-symbols-outlined">done_all</span>
                            Marcar todas como lidas
                        </button>
                    </div>

                    <!-- Tabs de filtro -->
                    <div class="notif-tabs" role="tablist">
                        <button class="notif-tab active" role="tab" aria-selected="true" data-filter="all" id="tab-all">
                            Todas <span class="notif-tab-count" id="count-all">0</span>
                        </button>
                        <button class="notif-tab" role="tab" aria-selected="false" data-filter="unread" id="tab-unread">
                            Não lidas <span class="notif-tab-count" id="count-unread">0</span>
                        </button>
                    </div>

                    <!-- Lista de notificações -->
                    <div class="notif-list" id="notif-list" role="list" aria-live="polite"></div>

                </div>
            </main>
        </div>
    </div>

    <script src="../services/api.js"></script>
    <script src="../services/auth-guard.js"></script>
    <script src="../services/notifications.js"></script>
    <script src="../components/nav.js"></script>
    <script>
        const NS = window.NotificationService;

        let currentFilter = 'all';

        // ── Renderização ───────────────────────────────────────────────────────────
        function iconEl(type, icon) {
            return `<div class="notif-icon ${type}" aria-hidden="true">
            <span class="material-symbols-outlined">${icon}</span>
        </div>`;
        }

        function renderList() {
            const all = NS.getAll();
            const unread = NS.getUnread();
            const items = currentFilter === 'unread' ? unread : all;

            // Atualiza contagens das tabs
            document.getElementById('count-all').textContent = all.length;
            document.getElementById('count-unread').textContent = unread.length;

            const list = document.getElementById('notif-list');
            list.innerHTML = '';

            if (items.length === 0) {
                list.innerHTML = `
                <div class="notif-empty" aria-live="polite">
                    <span class="material-symbols-outlined">notifications_off</span>
                    <p class="notif-empty-title">Tudo em dia!</p>
                    <p class="notif-empty-sub">${currentFilter === 'unread'
                        ? 'Nenhuma notificação não lida.' : 'Você não tem notificações.'}</p>
                </div>`;
                return;
            }

            items.forEach(n => {
                const li = document.createElement('div');
                li.className = `notif-item${n.read ? '' : ' unread'}`;
                li.setAttribute('role', 'listitem');
                li.setAttribute('data-id', n.id);
                li.innerHTML = `
                <div class="notif-stripe ${n.type}" aria-hidden="true"></div>
                ${iconEl(n.type, n.icon || NS.iconByType[n.type] || 'info')}
                <div class="notif-body">
                    <p class="notif-text">${n.text}</p>
                    <span class="notif-time">${NS.formatTime(n.date)}</span>
                </div>
                ${!n.read ? '<div class="notif-unread-dot" aria-label="Não lida"></div>' : ''}
                <div class="notif-actions">
                    <button class="notif-action-btn" data-action="read" aria-label="Marcar como lida" title="Marcar como lida" ${n.read ? 'style="display:none;"' : ''}>
                        <span class="material-symbols-outlined">mark_email_read</span>
                    </button>
                    <button class="notif-action-btn delete" data-action="delete" aria-label="Remover" title="Remover">
                        <span class="material-symbols-outlined">delete</span>
                    </button>
                </div>`;

                // Clicar no item → marcar como lido
                li.addEventListener('click', async e => {
                    if (e.target.closest('.notif-action-btn')) return;
                    if (!n.read) {
                        try {
                            await apiFetch('/notificacoes/' + n.id + '/ler', { method: 'PUT' });
                            NS.markAsRead(n.id);
                        } catch(err) {}
                    }
                });

                // Botão "Marcar como lida"
                li.querySelector('[data-action="read"]')?.addEventListener('click', async e => {
                    e.stopPropagation();
                    try {
                        await apiFetch('/notificacoes/' + n.id + '/ler', { method: 'PUT' });
                        NS.markAsRead(n.id);
                    } catch(err) {}
                });

                // Botão "Remover"
                li.querySelector('[data-action="delete"]').addEventListener('click', async e => {
                    e.stopPropagation();
                    li.style.transition = 'opacity 0.2s, transform 0.2s';
                    li.style.opacity = '0';
                    li.style.transform = 'translateX(24px)';
                    try {
                        await apiFetch('/notificacoes/' + n.id, { method: 'DELETE' });
                    } catch (err) {
                        console.warn('Não foi possível deletar notificação na API:', err);
                    }
                    setTimeout(() => NS.remove(n.id), 200);
                });

                list.appendChild(li);
            });
        }

        // ── Tabs ───────────────────────────────────────────────────────────────────
        document.querySelectorAll('.notif-tab').forEach(tab => {
            tab.addEventListener('click', () => {
                document.querySelectorAll('.notif-tab').forEach(t => {
                    t.classList.remove('active');
                    t.setAttribute('aria-selected', 'false');
                });
                tab.classList.add('active');
                tab.setAttribute('aria-selected', 'true');
                currentFilter = tab.dataset.filter;
                renderList();
            });
        });

        // ── Marcar todas como lidas ───────────────────────────────────────────────
        document.getElementById('btn-mark-all').addEventListener('click', async () => {
            try {
                await apiFetch('/notificacoes/ler-todas', { method: 'PUT' });
                NS.markAllAsRead();
            } catch (err) {}
        });

        // ── Atualização Automática ────────────────────────────────────────────────
        document.addEventListener('notifications-updated', renderList);

        // ── Init ──────────────────────────────────────────────────────────────────
        async function init() {
            await NS.sync();
            renderList();
        }
        init();
    </script>
</body>

</html>
