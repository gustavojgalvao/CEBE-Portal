<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>CEBE - Login</title>
    <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;500;600;700&amp;display=swap"
        rel="stylesheet" />
    <link
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
        rel="stylesheet" />
    <link href="../assets/style.css" rel="stylesheet" />
</head>

<body class="login-body">
    <main class="login-container">
        <div class="login-header">
            <img alt="Centro Educacional Boa Esperança Logo" class="login-logo"
                data-alt="Logotipo oficial do Centro Educacional Boa Esperança (CEBE) com as cores verde e branco."
                src="/client/public/logo.png" />
            <h1 class="login-title">Bem-vindo(a)</h1>
            <p class="login-subtitle">Acesse o portal acadêmico</p>
        </div>
        <div class="login-card">
            <form action="#" class="login-form" id="form-login" method="POST">
                <div class="form-group">
                    <label class="form-label" for="cpf">CPF do Responsável ou Aluno</label>
                    <div class="input-wrapper">
                        <span class="material-symbols-outlined input-icon">person</span>
                        <input class="form-input" id="cpf" name="cpf" placeholder="000.000.000-00" required=""
                            type="text" />
                    </div>
                </div>
                <div class="form-group">
                    <div class="form-label-wrapper">
                        <label class="form-label" for="password">Senha</label>
                    </div>
                    <div class="input-wrapper">
                        <span class="material-symbols-outlined input-icon">lock</span>
                        <input class="form-input password-input" id="password" name="password" placeholder="••••••••"
                            required="" type="password" />
                        <button aria-label="Toggle password visibility" class="botao-ocultar-senha" type="button"
                            onclick="togglePassword()">
                            <span class="material-symbols-outlined" id="toggle-icon">visibility_off</span>
                        </button>
                    </div>
                </div>
                <div class="form-actions">
                    <button class="btn-primary" type="submit">
                        Entrar
                        <span class="material-symbols-outlined btn-icon">login</span>
                    </button>
                </div>
                <!-- Mensagem de erro exibida quando o login falha -->
                <p class="form-error" id="msg-erro" style="display:none; color:#e53e3e; font-size:0.875rem; margin-top:0.5rem;"></p>
            </form>
        </div>
        <div class="login-footer">
            <p class="footer-text">
                Ainda não é aluno?
                <a class="signup-link" href="/client/src/pages/matricula.html">Matricule-se aqui</a>
            </p>
        </div>
    </main>

    <script>
        function togglePassword() {
            const passwordInput = document.getElementById('password');
            const toggleIcon = document.getElementById('toggle-icon');

            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                toggleIcon.textContent = 'visibility';
            } else {
                passwordInput.type = 'password';
                toggleIcon.textContent = 'visibility_off';
            }
        }
    </script>
    <!-- Scripts: ordem importa! api.js primeiro, depois auth.js, depois o evento do form -->
    <script src="../services/api.js"></script>
    <script src="../services/auth.js"></script>
    <script>
        document.getElementById('form-login').addEventListener('submit', async (e) => {
            e.preventDefault();

            const msgErro = document.getElementById('msg-erro');
            msgErro.style.display = 'none';
            msgErro.textContent = '';

            try {
                // O back-end usa e-mail como "usuário" e a senha cadastrada
                // O campo CPF do HTML está sendo passado como e-mail aqui
                // (adapte quando o back-end for atualizado para aceitar CPF)
                await login(
                    document.getElementById('cpf').value,    // campo CPF do HTML
                    document.getElementById('password').value // campo senha do HTML
                );
                window.location.href = 'dashboard.html';
            } catch (erro) {
                msgErro.style.display = 'block';
                msgErro.textContent = erro?.message || 'CPF ou senha incorretos. Tente novamente.';
            }
        });
    </script>
</body>

</html>
