<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>CEBE - Login</title>
    <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;500;600;700&amp;display=swap"
        rel="stylesheet" />
    <link
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
        rel="stylesheet" />
    <link href="../assets/style.css" rel="stylesheet" />
</head>

<body class="login-body">
    <main class="login-container">
        <div class="login-header">
            <a href="/client/index.html" style="display: flex; align-items: center; gap: 4px; color: #64748b; text-decoration: none; font-size: 0.875rem; position: absolute; top: 1.5rem; left: 1.5rem; transition: color 0.2s;" onmouseover="this.style.color='#10b981'" onmouseout="this.style.color='#64748b'">
                <span class="material-symbols-outlined" style="font-size: 18px;">arrow_back</span>
                Voltar
            </a>
            <img alt="Centro Educacional Boa Esperança Logo" class="login-logo"
                data-alt="Logotipo oficial do Centro Educacional Boa Esperança (CEBE) com as cores verde e branco."
                src="/client/public/logo.png" />
            <h1 class="login-title">Bem-vindo(a)</h1>
            <p class="login-subtitle">Acesse o portal acadêmico</p>
        </div>
        <div class="login-card">
            <form action="#" class="login-form" id="form-login" method="POST">
                <div class="form-group">
                    <label class="form-label" for="cpf">CPF do Responsável ou Aluno</label>
                    <div class="input-wrapper">
                        <span class="material-symbols-outlined input-icon">person</span>
                        <input class="form-input" id="cpf" name="cpf" placeholder="000.000.000-00" required=""
                            type="text" />
                    </div>
                </div>
                <div class="form-group">
                    <div class="form-label-wrapper">
                        <label class="form-label" for="data-nascimento">Data de Nascimento</label>
                    </div>
                    <div class="input-wrapper">
                        <span class="material-symbols-outlined input-icon">cake</span>
                        <input class="form-input" id="data-nascimento" name="data-nascimento" placeholder="DD/MM/AAAA"
                            required="" type="date" />
                    </div>
                </div>
                <div class="form-actions">
                    <button class="btn-primary" type="submit">
                        Entrar
                        <span class="material-symbols-outlined btn-icon">login</span>
                    </button>
                </div>
                <!-- Mensagem de erro exibida quando o login falha -->
                <p class="form-error" id="msg-erro"
                    style="display:none; color:#e53e3e; font-size:0.875rem; margin-top:0.5rem;"></p>
            </form>
        </div>
        <div class="login-footer">
            <p class="footer-text">
                Ainda não é aluno?
                <a class="signup-link" href="/client/src/pages/matricula.html">Matricule-se aqui</a>
            </p>
            <p class="footer-text" style="margin-top: 12px; font-size: 0.85rem;">
                <a class="signup-link" href="/client/src/pages/admin/login.html" style="color: #a0aec0;">Acesso Administrativo</a>
            </p>
        </div>
    </main>

    <script src="../services/api.js"></script>
    <script src="../services/auth.js"></script>
    <script>
        document.getElementById('form-login').addEventListener('submit', async (e) => {
            e.preventDefault();

            const msgErro = document.getElementById('msg-erro');
            msgErro.style.display = 'none';
            msgErro.textContent = '';

            // Converte a data do input (YYYY-MM-DD) para DDMMYYYY
            const dataRaw = document.getElementById('data-nascimento').value; // ex: "1990-01-01"
            const [ano, mes, dia] = dataRaw.split('-');
            const dataNascimento = dia + mes + ano; // ex: "01011990"

            // Limpa formatação do CPF (remove pontos e traços)
            const cpfLimpo = document.getElementById('cpf').value.replace(/\D/g, '');

            try {
                await login(
                    cpfLimpo,
                    dataNascimento
                );
                window.location.href = 'dashboard.html';
            } catch (erro) {
                msgErro.style.display = 'block';
                msgErro.textContent = 'CPF ou data de nascimento incorretos. Tente novamente.';
            }
        });
    </script>
</body>

</html>
