<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Meus Cursos – CEBE Portal. Acompanhe seu progresso, notas e faltas." />
    <title>Meus Cursos – CEBE</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@300;400;500;600;700&display=swap"
        rel="stylesheet" />
    <link
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap"
        rel="stylesheet" />
    <link rel="stylesheet" href="../assets/style.css" />
    <link rel="stylesheet" href="../assets/dashboard.css" />
    <link rel="stylesheet" href="../assets/cursos.css" />
</head>

<body class="dashboard-body">

    <div class="dashboard-layout">
        <div class="main-wrapper">
            <main class="cursos-main">
                <div class="cursos-content">

                    <!-- Cabeçalho -->
                    <div class="page-header">
                        <div>
                            <h1 class="page-title">Meus Cursos</h1>
                            <p class="page-subtitle">Acompanhe seu progresso e acesse o material didático das suas
                                formações.</p>
                        </div>
                        <div class="tab-switcher" role="tablist" aria-label="Filtro de cursos">
                            <button class="tab-btn active" role="tab" aria-selected="true" id="tab-andamento">Em
                                andamento</button>
                            <button class="tab-btn" role="tab" aria-selected="false"
                                id="tab-concluidos">Concluídos</button>
                        </div>
                    </div>

                    <!-- Grade principal -->
                    <div class="cursos-grid">

                        <!-- ── Coluna esquerda: lista de cursos ─────────── -->
                        <div class="cursos-left-col">
                            <h2 class="cursos-section-title">Cursos Ativos</h2>
                            <p style="color:var(--on-surface-variant); padding: 20px;">Carregando cursos...</p>
                        </div><!-- /cursos-left-col -->

                        <!-- ── Coluna direita: estado vazio ou detalhes ─── -->
                        <div class="cursos-right-col" id="course-details-col">

                            <!-- Estado vazio (padrão) -->
                            <div class="course-empty-state" id="course-empty-state">
                                <div class="course-empty-icon">
                                    <span class="material-symbols-outlined">school</span>
                                </div>
                                <p class="course-empty-title">Selecione um curso</p>
                                <p class="course-empty-sub">Clique em um dos seus cursos ao lado para ver notas, faltas
                                    e detalhes.</p>
                            </div>

                            <!-- Detalhes (injetados por JS) -->
                            <div id="course-detail-panel" style="display:none;"></div>

                        </div><!-- /cursos-right-col -->
                    </div><!-- /cursos-grid -->
                </div><!-- /cursos-content -->
            </main>
        </div><!-- /main-wrapper -->
    </div><!-- /dashboard-layout -->

    <script src="../services/api.js"></script>
    <script src="../services/auth-guard.js"></script>
    <script src="../services/notifications.js"></script>
    <script src="../components/nav.js"></script>
    <script>
        // ── Dados dos cursos globais (preenchido pela API) ─────────────────────────
        let CURSOS = {};
        let TODAS_MATRICULAS = []; // para filtro de tabs sem nova chamada API

        // ── Helpers ───────────────────────────────────────────────────────────────────
        function notaClass(nota) {
            if (nota === null) return 'nota-cell pendente';
            if (nota >= 7) return 'nota-cell aprovado';
            return 'nota-cell reprovado';
        }

        function notaText(nota) {
            return nota !== null ? nota.toFixed(1) : 'Pendente';
        }

        function freqClass(freq) {
            if (freq >= 75) return 'freq-cell ok';
            return 'freq-cell baixa';
        }

        // ── Renderização do painel de detalhes ────────────────────────────────────────
        function renderCurso(id) {
            const c = CURSOS[id];
            if (!c) return;

            const bannerHTML = c.banner
                ? `<img src="${c.banner}" alt="Banner – ${c.nome}" class="course-banner-img" />`
                : `<div class="course-banner-placeholder"><span class="material-symbols-outlined">school</span></div>`;

            const avaliacoesHTML = c.avaliacoes.length > 0
                ? c.avaliacoes.map(a => `
        <div class="assessment-item">
            <div class="assessment-left">
                <span class="material-symbols-outlined">description</span>
                <div>
                    <p class="assessment-name">${a.nome}</p>
                    <p class="assessment-date">Realizada em ${a.data}</p>
                </div>
            </div>
            <div class="assessment-right">
                <span class="assessment-nota-label">Nota</span>
                <span class="assessment-nota-value">${a.nota.toFixed(1)}</span>
            </div>
        </div>`).join('')
                : `<div style="padding:24px; text-align:center; color:var(--on-surface-variant);">
                    <span class="material-symbols-outlined" style="font-size:40px;display:block;margin-bottom:8px;opacity:0.5;">construction</span>
                    <p style="font-size:14px;">Avaliações em breve</p>
                    <p style="font-size:12px;margin-top:4px;opacity:0.7;">Seu histórico de provas aparecerá aqui assim que for lançado.</p>
                   </div>`;

            const materiasHTML = c.materias.length > 0
                ? c.materias.map(m => `
        <tr>
            <td>${m.nome}</td>
            <td class="${notaClass(m.nota)}">${notaText(m.nota)}</td>
            <td class="${freqClass(m.freq)}">${m.freq}%</td>
        </tr>`).join('')
                : `<tr><td colspan="3" style="text-align:center; padding:20px; color:var(--on-surface-variant); font-size:13px;">
                    <span class="material-symbols-outlined" style="font-size:20px;vertical-align:middle;opacity:0.5;">pending_actions</span>
                    Notas e frequência serão exibidas em breve
                   </td></tr>`;

            document.getElementById('course-detail-panel').innerHTML = `
        <div class="course-detail-animated">

            <!-- Banner -->
            <div class="course-banner">
                ${bannerHTML}
                <div class="course-banner-overlay">
                    <div class="course-banner-text">
                        <h2 class="course-banner-title">${c.nome}</h2>
                        <p class="course-banner-subtitle">${c.turma}</p>
                    </div>
                </div>
                <a href="#" class="btn-acessar-conteudo">
                    Acessar Conteúdo
                    <span class="material-symbols-outlined">arrow_forward</span>
                </a>
            </div>

            <!-- Título seção -->
            <h2 class="details-section-title">Detalhes: ${c.nome}</h2>

            <div class="details-grid">

                <!-- Provas e Notas -->
                <div class="detail-panel full-width">
                    <div class="detail-panel-header">
                        <span class="material-symbols-outlined">assignment</span>
                        <h3 class="detail-panel-title">Provas e Notas</h3>
                    </div>
                    <div class="assessments-list">${avaliacoesHTML}</div>
                </div>

                <!-- Tabela: Notas e Frequência -->
                <div class="table-panel full-width">
                    <div class="table-panel-header">
                        <div class="table-panel-header-left">
                            <span class="material-symbols-outlined">analytics</span>
                            <h3 class="table-panel-header-title">Notas e Frequência</h3>
                        </div>
                    </div>
                    <div class="table-scroll">
                        <table class="grades-table">
                            <thead>
                                <tr>
                                    <th>Matéria</th>
                                    <th class="center">Nota</th>
                                    <th class="right">Frequência</th>
                                </tr>
                            </thead>
                            <tbody>${materiasHTML}</tbody>
                        </table>
                    </div>
                </div>

            </div><!-- /details-grid -->
        </div><!-- /course-detail-animated -->`;
        }

        // ── Seleção de card ───────────────────────────────────────────────────────────
        const emptyState = document.getElementById('course-empty-state');
        const detailPanel = document.getElementById('course-detail-panel');
        let selectedCard = null;

        function selectCard(card) {
            // Reset visual
            document.querySelectorAll('.course-card-selected, .course-card-inactive').forEach(c => {
                c.className = 'course-card-inactive';
                c.querySelector('.course-card-name')?.classList.add('secondary-color');
            });

            // Ativa o card clicado
            card.className = 'course-card-selected';
            card.querySelector('.course-card-name')?.classList.remove('secondary-color');

            // Remove a decoração verde nos selecionados
            if (!card.querySelector('.course-card-selected-bg')) {
                const bg = document.createElement('div');
                bg.className = 'course-card-selected-bg';
                card.insertBefore(bg, card.firstChild);
            }

            // Renderiza detalhes
            renderCurso(card.id);
            emptyState.style.display = 'none';
            detailPanel.style.display = 'block';
            selectedCard = card.id;
        }

        async function inicializarCursos() {
            try {
                const matriculas = await apiFetch('/matriculas/me');
                const container = document.querySelector('.cursos-left-col');
                
                container.innerHTML = '<h2 class="cursos-section-title">Cursos Ativos</h2>';
                
                if (matriculas.length === 0) {
                    container.innerHTML += '<p style="color:var(--on-surface-variant); padding: 20px;">Você ainda não possui cursos matriculados.</p>';
                    return;
                }
                
                matriculas.forEach(mat => {
                    const cursoNome = mat.turma?.cursos?.nome || `Turma ${mat.turma?.id}`;
                    const turno = mat.turma?.turno || 'N/A';
                    const prof = mat.turma?.professor?.nome || 'Prof. Não Definido';
                    const idCard = 'card-' + mat.id;
                    
                    let horario = "08:00 – 11:00";
                    let dias = "Seg, Qua, Sex";
                    if(turno === "Vespertino") { horario = "14:00 – 17:00"; dias = "Ter, Qui"; }
                    
                    // Preenche o objeto CURSOS global com dados reais, sem notas mockadas
                    CURSOS[idCard] = {
                        nome: cursoNome,
                        categoria: 'Capacitação Profissional',
                        turma: `Turma ${mat.turma?.id || ''} • Turno ${turno}`,
                        professor: prof,
                        sala: 'Sala 04',
                        horario: `${dias}, ${horario}`,
                        progresso: 50,
                        banner: mat.turma?.cursos?.bannerUrl || null,
                        statusPagamento: mat.statusPagamento, // para filtro de tabs
                        // Sem dados mockados: avaliações e matérias serão exibidas como "em breve"
                        avaliacoes: [],
                        materias: []
                    };
                    
                    const article = document.createElement('article');
                    article.className = 'course-card-inactive';
                    article.id = idCard;
                    article.tabIndex = 0;
                    article.setAttribute('role', 'button');
                    
                    article.innerHTML = `
                        <div class="course-card-inner">
                            <div class="course-card-top">
                                <span class="course-category-tag primary-tag">Capacitação</span>
                            </div>
                            <h3 class="course-card-name secondary-color">${cursoNome}</h3>
                            <div class="course-info-grid">
                                <div class="course-info-item">
                                    <span class="material-symbols-outlined">person</span> ${prof}
                                </div>
                                <div class="course-info-item">
                                    <span class="material-symbols-outlined">meeting_room</span> Sala 04
                                </div>
                                <div class="course-info-item full-width">
                                    <span class="material-symbols-outlined">schedule</span> ${dias}, ${horario}
                                </div>
                            </div>
                            <div class="course-progress-section">
                                <div class="course-progress-label-row">
                                    <span>Progresso</span>
                                    <span class="course-progress-value">50%</span>
                                </div>
                                <div class="progress-bar-track">
                                    <div class="progress-bar-fill" style="width:50%"></div>
                                </div>
                            </div>
                        </div>
                    `;
                    
                    article.addEventListener('click', () => selectCard(article));
                    article.addEventListener('keydown', e => {
                        if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); selectCard(article); }
                    });
                    
                    container.appendChild(article);
                });
                
                TODAS_MATRICULAS = matriculas;
            } catch (erro) {
                console.error('Sessão inválida ou erro na API:', erro);
                window.location.href = 'login.html';
            }
        }
        inicializarCursos();

        // ── Tab switcher ──────────────────────────────────────────────────────────────
        document.querySelectorAll('.tab-btn').forEach(tab => {
            tab.addEventListener('click', () => {
                document.querySelectorAll('.tab-btn').forEach(t => {
                    t.classList.remove('active');
                    t.setAttribute('aria-selected', 'false');
                });
                tab.classList.add('active');
                tab.setAttribute('aria-selected', 'true');

                const filtro = tab.id === 'tab-concluidos' ? 'pago' : 'andamento';

                // Filtra os cards visiveis
                document.querySelectorAll('[id^="card-"]').forEach(card => {
                    const curso = CURSOS[card.id];
                    if (!curso) return;
                    if (filtro === 'pago') {
                        card.style.display = curso.statusPagamento === 'pago' ? '' : 'none';
                    } else {
                        card.style.display = curso.statusPagamento !== 'pago' ? '' : 'none';
                    }
                });

                // Atualiza título da coluna e reseta detalhe
                const titulo = document.querySelector('.cursos-section-title');
                if (titulo) titulo.textContent = filtro === 'pago' ? 'Cursos Concluídos' : 'Cursos Ativos';

                emptyState.style.display = 'flex';
                detailPanel.style.display = 'none';
                selectedCard = null;
            });
        });
    </script>
</body>
</html>
